<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#7A2323">
<title>Aurum & Frost — Billing</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFEFDD;
    --paper:#FFF8EE;
    --ink:#2A1714;
    --red:#B93435;
    --red-deep:#7A2323;
    --line:#E8D3B0;
    --line-soft:#F0E2C8;
    --muted:#9C4A42;
    --good:#3F7A4E;
    --good-bg:#E7F0E4;
    --warn:#B5581F;
    --warn-bg:#FBEADA;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    max-width:520px;
    margin:0 auto;
    position:relative;
  }
  ::selection{background:var(--red);color:var(--cream);}

  /* Header */
  header{
    background:var(--red-deep);
    color:var(--cream);
    padding:16px 18px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:20;
  }
  header .brand{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    font-size:19px;
  }
  header .tab-title{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:.75;
    margin-top:2px;
  }
  header .today{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    text-align:right;
    opacity:.85;
    line-height:1.5;
  }
  header .today b{font-size:14px;display:block;}

  main{
    flex:1;
    overflow-y:auto;
    padding:16px 16px 90px;
  }
  .view{display:none;}
  .view.active{display:block;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  h2.section-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:18px;
    color:var(--red-deep);
    margin-bottom:2px;
  }
  p.section-sub{
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:16px;
    line-height:1.5;
  }

  /* Cards */
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
  }
  .card-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .item-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
  }
  .item-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-top:3px;
  }
  .stock-pill{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
    font-weight:600;
  }
  .stock-ok{background:var(--good-bg);color:var(--good);}
  .stock-low{background:var(--warn-bg);color:var(--warn);}
  .stock-out{background:#F5DEDA;color:var(--red-deep);}

  /* Buttons */
  .btn{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:13px;
    border:none;
    border-radius:8px;
    padding:11px 16px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .btn-primary{background:var(--red);color:var(--cream);}
  .btn-primary:active{background:var(--red-deep);}
  .btn-outline{background:transparent;border:1px solid var(--red);color:var(--red-deep);}
  .btn-ghost{background:var(--line-soft);color:var(--ink);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-sm{padding:7px 12px;font-size:11.5px;border-radius:7px;}

  .fab{
    position:fixed;
    right:calc(50% - 260px + 18px);
    bottom:96px;
    width:52px;height:52px;
    border-radius:50%;
    background:var(--red);
    color:var(--cream);
    font-size:26px;
    border:none;
    box-shadow:0 8px 18px rgba(122,35,35,.35);
    z-index:15;
    display:flex;align-items:center;justify-content:center;
  }
  @media (max-width:519px){
    .fab{right:18px;}
  }

  /* Stepper */
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stepper button{
    width:40px;height:40px;
    border-radius:50%;
    border:1px solid var(--red);
    background:var(--paper);
    color:var(--red-deep);
    font-size:18px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .stepper span{
    font-family:'JetBrains Mono',monospace;
    font-weight:600;
    min-width:20px;
    text-align:center;
  }

  /* Bill tab */
  .product-grid{display:flex;flex-direction:column;gap:8px;}
  .product-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .product-card .price{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--red);
    margin-top:2px;
  }
  .add-btn{
    width:44px;height:44px;
    border-radius:50%;
    border:none;
    background:var(--red);
    color:var(--cream);
    font-size:22px;
    display:flex;align-items:center;justify-content:center;
  }

  .cart-bar{
    position:fixed;
    bottom:64px;
    left:0;right:0;
    max-width:520px;
    margin:0 auto;
    background:var(--red-deep);
    color:var(--cream);
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:18;
    border-radius:12px 12px 0 0;
  }
  .cart-bar.hidden{display:none;}
  .cart-bar .cnt{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    opacity:.8;
  }
  .cart-bar .amt{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
  }

  /* Bottom nav */
  nav.tabbar{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:520px;
    margin:0 auto;
    background:var(--paper);
    border-top:1px solid var(--line);
    display:flex;
    z-index:20;
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    padding:10px 4px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    color:var(--muted);
  }
  nav.tabbar button.active{color:var(--red-deep);}
  nav.tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}
  nav.tabbar .tlabel{
    font-family:'JetBrains Mono',monospace;
    font-size:8.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
  }

  /* Forms / modal */
  .sheet-backdrop{
    position:fixed;inset:0;
    background:rgba(42,23,20,.45);
    z-index:30;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--paper);
    width:100%;
    max-width:520px;
    border-radius:16px 16px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:86vh;
    overflow-y:auto;
  }
  .sheet h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    color:var(--red-deep);
    margin-bottom:14px;
  }
  label{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:5px;
    margin-top:12px;
  }
  label:first-of-type{margin-top:0;}
  input, select, textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--cream);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--red);outline-offset:1px;}
  textarea{resize:vertical;}
  .form-row{display:flex;gap:10px;}
  .form-row > div{flex:1;}
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }

  .recipe-line{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
  }
  .recipe-line select{flex:1.4;}
  .recipe-line input{flex:.8;}
  .recipe-line button{
    background:none;border:none;color:var(--red);font-size:16px;font-weight:700;
    width:24px;
  }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--muted);
  }
  .empty .big{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:16px;
    color:var(--red-deep);
    margin-bottom:6px;
  }
  .empty p{font-size:12px;line-height:1.6;}

  .toast{
    position:fixed;
    top:70px;left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--cream);
    padding:10px 18px;
    border-radius:20px;
    font-size:12.5px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
    white-space:nowrap;
  }
  .toast.show{opacity:1;}

  /* Receipt */
  .receipt{
    background:var(--paper);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:18px;
  }
  .receipt-head{text-align:center;margin-bottom:14px;}
  .receipt-head .rb{
    font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:18px;color:var(--red-deep);
  }
  .receipt-head .rt{
    font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:2px;
  }
  .receipt-line{
    display:flex;justify-content:space-between;
    font-size:12.5px;
    padding:6px 0;
    border-bottom:1px dashed var(--line-soft);
  }
  .receipt-total{
    display:flex;justify-content:space-between;
    font-family:'Fraunces',serif;font-weight:600;font-size:16px;
    color:var(--red-deep);
    padding-top:10px;margin-top:6px;
    border-top:1px solid var(--line);
  }
  .receipt-meta{
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;color:var(--muted);text-align:center;margin-top:14px;
  }

  .stat-grid{display:flex;gap:10px;margin-bottom:16px;}
  .stat{
    flex:1;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .stat .n{font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:var(--red-deep);}
  .stat .l{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px;}

  .loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:12px;}

  /* ---------- Quote / cost calculator ---------- */
  .q-sec{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--red-deep);margin-bottom:8px;}
  .q-hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px;}
  .qline{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;}
  .qline .r1{display:flex;gap:8px;align-items:center;}
  .qline .r1 select,.qline .r1 input{flex:1;min-width:0;}
  .qline .r2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px;align-items:end;}
  .qline .x{background:none;border:none;color:var(--red);font-size:20px;font-weight:700;width:28px;height:28px;flex:none;}
  .qline small{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
  .qline .lc{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--red-deep);padding-bottom:12px;white-space:nowrap;}
  .q-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .q-chip{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:6px 10px;border-radius:20px;border:1px solid var(--red);background:transparent;color:var(--red-deep);}
  .q-top{background:var(--red-deep);border-color:var(--red-deep);color:var(--cream);}
  .q-top .q-lbl{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.04em;opacity:.78;}
  .q-top .q-big{font-family:'Fraunces',serif;font-weight:600;font-size:32px;margin-top:4px;line-height:1.1;}
  .q-top .q-big small{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:400;opacity:.8;}
  .q-top .q-sub{font-family:'JetBrains Mono',monospace;font-size:10.5px;opacity:.88;margin-top:6px;line-height:1.6;}
  .q-warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.5;margin-bottom:10px;}
  .q-row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line-soft);}
  .q-row.b{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--red-deep);border-bottom:none;border-top:1px solid var(--line);margin-top:4px;padding-top:9px;}
  .q-row span:last-child{font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right;}
  .q-row.b span:last-child{font-family:'Fraunces',serif;font-size:15px;}
  table.qt{width:100%;border-collapse:collapse;}
  table.qt th{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 3px;font-weight:500;}
  table.qt td{padding:6px 3px;border-top:1px solid var(--line-soft);text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;}
  table.qt th:first-child,table.qt td:first-child{text-align:left;}
  table.qt tr.hl td{background:var(--good-bg);}
  table.qt input{width:62px;padding:6px 6px;font-size:13px;}
  .q-pos{color:var(--good);}
  .q-neg{color:var(--red-deep);}
  .q-info{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);line-height:1.6;padding-bottom:12px;}
  .q-isum{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .q-isum:empty{display:none;}
  .q-isum b{font-family:'Fraunces',serif;font-weight:600;color:var(--red-deep);}
  table.qt td input{width:56px;}
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">Aurum &amp; Frost</div>
    <div class="tab-title" id="tabTitle">Billing</div>
  </div>
  <div class="today">
    <span id="todayDate"></span>
    <b id="todayTotal">₹0</b>
  </div>
</header>

<main id="main">
  <div class="loading" id="loadingMsg">Loading your data…</div>
</main>

<div class="cart-bar hidden" id="cartBar">
  <div>
    <div class="cnt" id="cartCount">0 items</div>
    <div class="amt" id="cartAmt">₹0</div>
  </div>
  <button class="btn btn-primary" id="reviewBillBtn">Review Bill</button>
</div>

<div class="cart-bar hidden" id="quoteBar">
  <div>
    <div class="cnt" id="qbCnt">Order value</div>
    <div class="amt" id="qbAmt">₹0</div>
  </div>
  <button class="btn btn-primary" id="qbBtn">See details</button>
</div>

<nav class="tabbar">
  <button data-tab="bill" class="active">
    <svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M9 12h6M9 16h6M9 8h2"/></svg>
    <span class="tlabel">Bill</span>
  </button>
  <button data-tab="stock">
    <svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.5 8.5l8.5 4.5 8.5-4.5M12 13v8"/></svg>
    <span class="tlabel">Stock</span>
  </button>
  <button data-tab="recipes">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    <span class="tlabel">Recipes</span>
  </button>
  <button data-tab="reports">
    <svg viewBox="0 0 24 24"><path d="M4 19V10M11 19V4M18 19v-7"/></svg>
    <span class="tlabel">Reports</span>
  </button>
  <button data-tab="quote">
    <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/></svg>
    <span class="tlabel">Quote</span>
  </button>
</nav>

<button class="fab" id="fabBtn">+</button>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" id="sheetContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------- State ----------
let ingredients = [];
let products = [];
let sales = [];
let currentTab = 'bill';
let cart = {}; // productId -> qty

const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const money = n => '₹' + (Math.round(n*100)/100).toLocaleString('en-IN');
const moneyPdf = n => 'Rs. ' + (Math.round(n*100)/100).toLocaleString('en-IN');

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------- Storage ----------
// Uses Claude's artifact storage when running inside Claude, and falls back
// to the browser's own localStorage when hosted standalone (e.g. after
// deploying this file to your own site / wrapping it into an APK).
const usingClaudeStorage = (typeof window.storage !== 'undefined');

async function storageGet(key){
  if(usingClaudeStorage){
    try{
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  if(usingClaudeStorage){
    try{
      const r = await window.storage.set(key, value, false);
      return !!r;
    }catch(e){ return false; }
  }
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}

async function loadAll(){
  try{
    const [i,p,s,qs,qd,ov] = await Promise.all([
      safeGet('af-ingredients'),
      safeGet('af-products'),
      safeGet('af-sales'),
      safeGet('af-quotes'),
      safeGet('af-quote-draft'),
      safeGet('af-overheads'),
    ]);
    ingredients = i || [];
    products = p || [];
    sales = s || [];
    savedQuotes = Array.isArray(qs) ? qs : [];
    overheads = Array.isArray(ov) ? ov : [];
    quote = normQuote(qd);
  }catch(e){
    console.error('Load error', e);
    toast('Could not load saved data — starting fresh');
  }
}
async function safeGet(key){
  try{
    const val = await storageGet(key);
    return val ? JSON.parse(val) : null;
  }catch(e){
    return null;
  }
}
async function save(key, val){
  const ok = await storageSet(key, JSON.stringify(val));
  if(!ok) toast('Save failed — try again');
  return ok;
}
const saveIngredients = () => save('af-ingredients', ingredients);
const saveProducts = () => save('af-products', products);
const saveSales = () => save('af-sales', sales);

// ---------- Header ----------
function updateHeader(){
  $('#todayDate').textContent = new Date().toLocaleDateString('en-IN', {day:'2-digit', month:'short'});
  const todayStr = new Date().toDateString();
  const todayTotal = sales.filter(s => new Date(s.ts).toDateString() === todayStr)
                           .reduce((a,s)=>a+s.total,0);
  $('#todayTotal').textContent = money(todayTotal);
  const titles = {bill:'Billing', stock:'Ingredient Stock', recipes:'Products & Recipes', reports:'Reports', quote:'Cost Calculator'};
  $('#tabTitle').textContent = titles[currentTab];
}

// ---------- Tabs ----------
$$('.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentTab = btn.dataset.tab;
    $$('.tabbar button').forEach(b=>b.classList.toggle('active', b===btn));
    render();
  });
});

$('#fabBtn').addEventListener('click', ()=>{
  if(currentTab==='stock') openIngredientForm();
  else if(currentTab==='recipes') openProductForm();
  else if(currentTab==='bill') openIngredientForm(); // fallback, hidden anyway
});

function updateFab(){
  const fab = $('#fabBtn');
  fab.style.display = (currentTab==='stock' || currentTab==='recipes') ? 'flex' : 'none';
}

// ---------- Render dispatch ----------
function render(){
  updateHeader();
  updateFab();
  const main = $('#main');
  if(currentTab==='bill') renderBill(main);
  else if(currentTab==='stock') renderStock(main);
  else if(currentTab==='recipes'){ renderRecipes(main); renderOverheadCard(main); }
  else if(currentTab==='reports') renderReports(main);
  else if(currentTab==='quote') renderQuote(main);
  renderCartBar();
  $('#quoteBar').classList.toggle('hidden', currentTab!=='quote');
}

// ================= BILL TAB =================
function renderBill(main){
  if(products.length===0){
    main.innerHTML = `<div class="empty">
      <div class="big">No products yet</div>
      <p>Add a product with its recipe in the Recipes tab, produce some stock, then come back here to start billing.</p>
    </div>`;
    return;
  }
  main.innerHTML = `
    <h2 class="section-title">Take an order</h2>
    <p class="section-sub">Tap + to add items. Only items with stock in hand can be sold.</p>
    <div class="product-grid" id="productGrid"></div>
  `;
  const grid = $('#productGrid');
  products.forEach(p=>{
    const qtyInCart = cart[p.id] || 0;
    const out = p.stock <= 0;
    const el = document.createElement('div');
    el.className = 'product-card';
    el.innerHTML = `
      <div>
        <div class="item-name">${esc(p.name)}</div>
        <div class="price">${money(p.price)} · ${out ? '<span style="color:var(--red-deep)">out of stock</span>' : p.stock + ' in stock'}</div>
      </div>
      ${qtyInCart>0 ? `
        <div class="stepper">
          <button data-act="dec" data-id="${p.id}">−</button>
          <span>${qtyInCart}</span>
          <button data-act="inc" data-id="${p.id}" ${qtyInCart>=p.stock?'disabled':''}>+</button>
        </div>
      ` : `<button class="add-btn" data-act="inc" data-id="${p.id}" ${out?'disabled style="opacity:.35"':''}>+</button>`}
    `;
    grid.appendChild(el);
  });
  grid.addEventListener('click', e=>{
    const btn = e.target.closest('button[data-act]');
    if(!btn) return;
    const id = btn.dataset.id;
    const prod = products.find(p=>p.id===id);
    if(!prod) return;
    const cur = cart[id]||0;
    if(btn.dataset.act==='inc'){
      if(cur >= prod.stock){ toast(`Only ${prod.stock} in stock`); return; }
      cart[id] = cur+1;
    } else {
      cart[id] = Math.max(0, cur-1);
      if(cart[id]===0) delete cart[id];
    }
    renderBill(main);
    renderCartBar();
  });
}

function renderCartBar(){
  const bar = $('#cartBar');
  const ids = Object.keys(cart);
  if(currentTab!=='bill' || ids.length===0){ bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  let count=0, total=0;
  ids.forEach(id=>{
    const p = products.find(x=>x.id===id);
    if(!p) return;
    count += cart[id];
    total += cart[id]*p.price;
  });
  $('#cartCount').textContent = `${count} item${count!==1?'s':''}`;
  $('#cartAmt').textContent = money(total);
}

$('#reviewBillBtn').addEventListener('click', openBillReview);
$('#qbBtn').addEventListener('click', ()=>{ const el = $('#qSummary'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); });

function openBillReview(){
  const ids = Object.keys(cart);
  if(ids.length===0) return;
  let total = 0;
  const lines = ids.map(id=>{
    const p = products.find(x=>x.id===id);
    const qty = cart[id];
    const lineTotal = qty*p.price;
    total += lineTotal;
    return `<div class="receipt-line"><span>${esc(p.name)} × ${qty}</span><span>${money(lineTotal)}</span></div>`;
  }).join('');
  openSheet(`
    <h3>Review Bill</h3>
    <div class="receipt">
      <div class="receipt-head">
        <div class="rb">Aurum &amp; Frost</div>
        <div class="rt">Order Summary</div>
      </div>
      ${lines}
      <div class="receipt-total"><span>Total</span><span>${money(total)}</span></div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost btn-block" id="cancelBillBtn">Back</button>
      <button class="btn btn-primary btn-block" id="confirmBillBtn">Complete Sale</button>
    </div>
  `);
  $('#cancelBillBtn').addEventListener('click', closeSheet);
  $('#confirmBillBtn').addEventListener('click', async ()=>{
    // validate stock again
    for(const id of ids){
      const p = products.find(x=>x.id===id);
      if(cart[id] > p.stock){ toast(`${p.name} only has ${p.stock} left`); return; }
    }
    const items = ids.map(id=>{
      const p = products.find(x=>x.id===id);
      return {productId:id, name:p.name, qty:cart[id], price:p.price, cost:computeProductCost(p)};
    });
    ids.forEach(id=>{
      const p = products.find(x=>x.id===id);
      p.stock -= cart[id];
    });
    const sale = {id:uid(), ts:Date.now(), items, total};
    sales.unshift(sale);
    await Promise.all([saveProducts(), saveSales()]);
    cart = {};
    closeSheet();
    showReceipt(sale);
    render();
  });
}

function showReceipt(sale){
  const lines = sale.items.map(it=>
    `<div class="receipt-line"><span>${esc(it.name)} × ${it.qty}</span><span>${money(it.qty*it.price)}</span></div>`
  ).join('');
  openSheet(`
    <h3>Sale Complete</h3>
    <div class="receipt" id="receiptPrintArea">
      <div class="receipt-head">
        <div class="rb">Aurum &amp; Frost</div>
        <div class="rt">Bliss · Creamy · Delight</div>
      </div>
      ${lines}
      <div class="receipt-total"><span>Total</span><span>${money(sale.total)}</span></div>
      <div class="receipt-meta">${new Date(sale.ts).toLocaleString('en-IN')}</div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-outline btn-block" id="shareBillBtn">Share Receipt</button>
      <button class="btn btn-primary btn-block" id="doneBillBtn">Done</button>
    </div>
  `);
  $('#doneBillBtn').addEventListener('click', closeSheet);
  $('#shareBillBtn').addEventListener('click', async ()=>{
    const btn = $('#shareBillBtn');
    const original = btn.textContent;
    btn.textContent = 'Preparing receipt…';
    btn.disabled = true;
    try{
      if(typeof window.jspdf === 'undefined'){
        toast('PDF library still loading — try again in a moment');
        return;
      }
      const blob = buildReceiptPdfBlob(sale);
      const fileName = `Aurum-Frost-Receipt-${sale.id}.pdf`;
      const file = new File([blob], fileName, {type:'application/pdf'});

      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file], title:'Aurum & Frost Receipt', text:'Your receipt from Aurum & Frost'});
        }catch(e){
          if(e.name !== 'AbortError') downloadPdfFallback(blob, fileName);
        }
      } else {
        downloadPdfFallback(blob, fileName);
      }
    }catch(e){
      console.error(e);
      toast('Could not generate receipt');
    }finally{
      btn.textContent = original;
      btn.disabled = false;
    }
  });
}

function buildReceiptPdfBlob(sale){
  const { jsPDF } = window.jspdf;
  const targetWidth = 300;
  const lineHeight = 20;
  const headerHeight = 130;
  const footerHeight = 70;
  // jsPDF's format:[a,b] always makes the SMALLER number the width and the
  // LARGER one the height (it forces portrait). Guarantee height is always
  // comfortably bigger than width so our narrow receipt shape is preserved
  // even for a single-item sale.
  const contentHeight = headerHeight + sale.items.length*lineHeight + footerHeight;
  const targetHeight = Math.max(contentHeight, targetWidth + 10);

  const doc = new jsPDF({unit:'pt', format:[targetWidth, targetHeight]});
  // Read back the real page size rather than trusting our own numbers —
  // this is what actually gets drawn on.
  const pageW = doc.internal.pageSize.getWidth();
  const cx = pageW/2;
  const margin = 22;
  const red = [122,35,35];
  const ink = [42,23,20];
  const muted = [130,90,80];
  let y = 34;

  doc.setFont('times','italic'); doc.setFontSize(18); doc.setTextColor(...red);
  doc.text('Aurum & Frost', cx, y, {align:'center'});
  y += 16;
  doc.setFont('courier','normal'); doc.setFontSize(7.5); doc.setTextColor(...muted);
  doc.text('BLISS · CREAMY · DELIGHT', cx, y, {align:'center'});
  y += 22;
  doc.setDrawColor(220,190,150);
  doc.setLineDashPattern([2,2],0);
  doc.line(margin, y, pageW-margin, y);
  doc.setLineDashPattern([],0);
  y += 22;

  sale.items.forEach(it=>{
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...ink);
    doc.text(`${it.name} × ${it.qty}`, margin, y);
    doc.text(moneyPdf(it.qty*it.price), pageW-margin, y, {align:'right'});
    y += lineHeight;
  });

  y += 4;
  doc.setDrawColor(...red);
  doc.line(margin, y, pageW-margin, y);
  y += 22;
  doc.setFont('times','bold'); doc.setFontSize(14); doc.setTextColor(...red);
  doc.text('Total', margin, y);
  doc.text(moneyPdf(sale.total), pageW-margin, y, {align:'right'});
  y += 26;

  doc.setFont('courier','normal'); doc.setFontSize(7.5); doc.setTextColor(...muted);
  doc.text(new Date(sale.ts).toLocaleString('en-IN'), cx, y, {align:'center'});
  y += 16;
  doc.setFont('helvetica','italic'); doc.setFontSize(8); doc.setTextColor(...red);
  doc.text('Made fresh, ingredient by ingredient', cx, y, {align:'center'});
  y += 11;
  doc.text('— no code names needed.', cx, y, {align:'center'});

  return doc.output('blob');
}

// ================= STOCK TAB (ingredients) =================
function renderStock(main){
  if(ingredients.length===0){
    main.innerHTML = `<div class="empty">
      <div class="big">No ingredients yet</div>
      <p>Tap + to add your first ingredient — milk, cream, sugar, whatever you stock and measure.</p>
    </div>`;
    return;
  }
  main.innerHTML = `
    <h2 class="section-title">Ingredients on hand</h2>
    <p class="section-sub">This is your raw material stock — what production draws down from.</p>
    <div id="ingList"></div>
  `;
  const list = $('#ingList');
  ingredients.forEach(ing=>{
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="card-row">
        <div>
          <div class="item-name">${esc(ing.name)}</div>
          <div class="item-meta">${ing.stock} ${esc(ing.unit)} in stock ${ing.rate?`· ${rateTxt(ing.rate)}/${esc(ing.unit)}`:'· no cost set'}</div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-sm btn-ghost" data-act="add" data-id="${ing.id}">+ Stock</button>
          <button class="btn btn-sm btn-outline" data-act="edit" data-id="${ing.id}">Edit</button>
        </div>
      </div>
    `;
    list.appendChild(el);
  });
  list.addEventListener('click', e=>{
    const btn = e.target.closest('button[data-act]');
    if(!btn) return;
    const ing = ingredients.find(i=>i.id===btn.dataset.id);
    if(btn.dataset.act==='add') openAddStock(ing);
    else openIngredientForm(ing);
  });
}

function openIngredientForm(existing){
  openSheet(`
    <h3>${existing?'Edit Ingredient':'Add Ingredient'}</h3>
    <label>Name</label>
    <input id="fName" value="${existing?esc(existing.name):''}" placeholder="e.g. Fresh Cream">
    <div class="form-row">
      <div>
        <label>Unit</label>
        <select id="fUnit">
          ${['ml','L','g','kg','pcs','pod'].map(u=>`<option value="${u}" ${existing&&existing.unit===u?'selected':''}>${u}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Starting Stock</label>
        <input id="fStock" type="number" min="0" step="any" value="${existing?existing.stock:0}">
      </div>
    </div>
    <label>What you bought</label>
    <div class="form-row">
      <div><input id="fPackQty" type="number" min="0" step="any" inputmode="decimal" value="${existing?(existing.packQty||1):''}" placeholder="Quantity, e.g. 1"></div>
      <div><input id="fPackPrice" type="number" min="0" step="any" inputmode="decimal" value="${existing?(existing.packPrice!=null?existing.packPrice:(existing.rate||'')):''}" placeholder="Paid ₹, e.g. 300"></div>
    </div>
    <p class="section-sub" id="fRateOut" style="margin-top:6px;font-weight:600;"></p>
    <p class="section-sub" style="margin-top:2px;">Enter the quantity (in the unit above) and the price you paid for it, for example 1 L cream for ₹300, or 10 pods for ₹1,500. The cost per unit is worked out for you and used to cost your flavours.</p>
    <div class="sheet-actions">
      <button class="btn btn-ghost btn-block" id="cancelIngBtn">Cancel</button>
      <button class="btn btn-primary btn-block" id="saveIngBtn">${existing?'Save':'Add'}</button>
    </div>
    ${existing?'<button class="btn btn-outline btn-block" style="margin-top:10px;color:var(--red)" id="delIngBtn">Delete Ingredient</button>':''}
  `);
  function updateRateOut(){
    const pq = parseFloat($('#fPackQty').value)||0;
    const pp = parseFloat($('#fPackPrice').value)||0;
    const u = $('#fUnit').value;
    $('#fRateOut').textContent = (pq>0 && pp>0) ? `= ${rateTxt(pp/pq)} per ${u}` : `Cost per ${u} will show here`;
  }
  ['#fPackQty','#fPackPrice'].forEach(sel=>$(sel).addEventListener('input', updateRateOut));
  $('#fUnit').addEventListener('change', updateRateOut);
  updateRateOut();
  $('#cancelIngBtn').addEventListener('click', closeSheet);
  $('#saveIngBtn').addEventListener('click', async ()=>{
    const name = $('#fName').value.trim();
    const unit = $('#fUnit').value;
    const stock = parseFloat($('#fStock').value)||0;
    const packQty = parseFloat($('#fPackQty').value)||0;
    const packPrice = parseFloat($('#fPackPrice').value)||0;
    const rate = (packQty>0 && packPrice>0) ? packPrice/packQty : 0;
    if(!name){ toast('Enter a name'); return; }
    if(existing){
      existing.name=name; existing.unit=unit; existing.stock=stock; existing.rate=rate;
      existing.packQty=packQty; existing.packPrice=packPrice;
    } else {
      ingredients.push({id:uid(), name, unit, stock, rate, packQty, packPrice});
    }
    await saveIngredients();
    closeSheet(); render();
    toast(existing?'Ingredient updated':'Ingredient added');
  });
  if(existing){
    $('#delIngBtn').addEventListener('click', async ()=>{
      if(!confirm(`Remove ${existing.name}? This won't undo recipes that reference it.`)) return;
      ingredients = ingredients.filter(i=>i.id!==existing.id);
      await saveIngredients();
      closeSheet(); render();
    });
  }
}

function openAddStock(ing){
  openSheet(`
    <h3>Add Stock — ${esc(ing.name)}</h3>
    <label>Quantity to add (${esc(ing.unit)})</label>
    <input id="fAdd" type="number" min="0" step="any" placeholder="0">
    <p class="section-sub" style="margin-top:8px;">Current: ${ing.stock} ${esc(ing.unit)} · Cost: ${ing.rate?rateTxt(ing.rate)+'/'+esc(ing.unit):'not set'}</p>
    <label>Total paid for this quantity (₹) — optional</label>
    <input id="fPurchasePaid" type="number" min="0" step="any" inputmode="decimal" placeholder="Leave blank to keep the current cost">
    <p class="section-sub" style="margin-top:4px;">If the price changed this time, enter what you paid for the quantity above. The cost per ${esc(ing.unit)} is worked out and used for all future costing.</p>
    <div class="sheet-actions">
      <button class="btn btn-ghost btn-block" id="cancelAddBtn">Cancel</button>
      <button class="btn btn-primary btn-block" id="confirmAddBtn">Add Stock</button>
    </div>
  `);
  $('#cancelAddBtn').addEventListener('click', closeSheet);
  $('#confirmAddBtn').addEventListener('click', async ()=>{
    const qty = parseFloat($('#fAdd').value);
    if(!qty || qty<=0){ toast('Enter a valid quantity'); return; }
    const paid = parseFloat($('#fPurchasePaid').value);
    ing.stock = Math.round((ing.stock + qty)*1000)/1000;
    if(paid && paid>0){ ing.rate = paid/qty; ing.packQty = qty; ing.packPrice = paid; }
    await saveIngredients();
    closeSheet(); render();
    toast(`Added ${qty} ${ing.unit} of ${ing.name}`);
  });
}

// ================= RECIPES TAB (products) =================
function renderRecipes(main){
  if(products.length===0 && ingredients.length===0){
    main.innerHTML = `<div class="empty">
      <div class="big">Start with ingredients</div>
      <p>Add your ingredients in the Stock tab first, then come back here to build products from them.</p>
    </div>`;
    return;
  }
  if(products.length===0){
    main.innerHTML = `<div class="empty">
      <div class="big">No products yet</div>
      <p>Tap + to create your first product — e.g. "Vanilla Tub 500ml" — and define what it's made from.</p>
    </div>`;
    return;
  }
  main.innerHTML = `
    <h2 class="section-title">Products &amp; recipes</h2>
    <p class="section-sub">Each product draws from your ingredient stock when you log production.</p>
    <div id="prodList"></div>
  `;
  const list = $('#prodList');
  products.forEach(p=>{
    const el = document.createElement('div');
    el.className = 'card';
    const recipeText = (p.recipe||[]).map(r=>{
      const ing = ingredients.find(i=>i.id===r.ingredientId);
      return ing ? `${r.qty}${ing.unit} ${ing.name}` : null;
    }).filter(Boolean).join(', ');
    const cost = computeProductCost(p);
    const margin = p.price - cost;
    const marginPct = p.price>0 ? Math.round((margin/p.price)*100) : 0;
    const marginColor = margin<0 ? 'var(--red-deep)' : 'var(--good)';
    el.innerHTML = `
      <div class="card-row">
        <div>
          <div class="item-name">${esc(p.name)}</div>
          <div class="item-meta">${money(p.price)} · ${p.stock} in stock</div>
          ${recipeText ? `<div class="item-meta" style="margin-top:4px;opacity:.85">Per batch${prodYield(p)!==1?` (makes ${prodYield(p)})`:''}: ${esc(recipeText)}</div>` : ''}
          <div class="item-meta" style="margin-top:4px;color:${marginColor}">Cost ${money(cost)} · Margin ${money(margin)} (${marginPct}%)</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-sm btn-primary" data-act="produce" data-id="${p.id}">Produce Batch</button>
        <button class="btn btn-sm btn-outline" data-act="edit" data-id="${p.id}">Edit</button>
      </div>
    `;
    list.appendChild(el);
  });
  list.addEventListener('click', e=>{
    const btn = e.target.closest('button[data-act]');
    if(!btn) return;
    const p = products.find(x=>x.id===btn.dataset.id);
    if(btn.dataset.act==='produce') openProduceForm(p);
    else openProductForm(p);
  });
}

function openProductForm(existing){
  if(ingredients.length===0){
    toast('Add ingredients first, in the Stock tab');
    return;
  }
  const recipe = existing ? existing.recipe.map(r=>({...r})) : [];
  if(recipe.length===0) recipe.push({ingredientId: ingredients[0].id, qty:''});

  function recipeRowsHtml(){
    return recipe.map((r,idx)=>`
      <div class="recipe-line" data-idx="${idx}">
        <select data-f="ingredientId">
          ${ingredients.map(i=>`<option value="${i.id}" ${r.ingredientId===i.id?'selected':''}>${esc(i.name)} (${i.unit})</option>`).join('')}
        </select>
        <input data-f="qty" type="number" min="0" step="any" placeholder="qty" value="${r.qty}">
        <button data-act="removeLine" type="button">×</button>
      </div>
    `).join('');
  }

  openSheet(`
    <h3>${existing?'Edit Product':'Add Product'}</h3>
    <label>Product Name</label>
    <input id="fPName" value="${existing?esc(existing.name):''}" placeholder="e.g. Vanilla Tub 500ml">
    <div class="form-row">
      <div>
        <label>Selling Price per unit (₹)</label>
        <input id="fPPrice" type="number" min="0" step="any" value="${existing?existing.price:''}">
      </div>
      <div>
        <label>Current Stock (units)</label>
        <input id="fPStock" type="number" min="0" step="any" value="${existing?existing.stock:0}">
      </div>
    </div>
    <div class="form-row">
      <div>
        <label>One batch makes (units)</label>
        <input id="fPYield" type="number" min="0" step="any" inputmode="decimal" value="${existing?(existing.batchYield||1):''}" placeholder="e.g. 6">
      </div>
      <div>
        <label>Sold as</label>
        <input id="fPUnit" value="${existing?esc(existing.unitLabel||''):''}" placeholder="e.g. 500 ml tub">
      </div>
    </div>
    <label style="margin-top:16px;">Recipe — ingredients for one batch</label>
    <div id="recipeLines">${recipeRowsHtml()}</div>
    <button class="btn btn-sm btn-ghost" id="addLineBtn" type="button" style="margin-top:8px;">+ Add Ingredient Line</button>
    <div class="card" id="costPreview" style="margin-top:14px;"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost btn-block" id="cancelPBtn">Cancel</button>
      <button class="btn btn-primary btn-block" id="savePBtn">${existing?'Save':'Add'}</button>
    </div>
    ${existing?'<button class="btn btn-outline btn-block" style="margin-top:10px;color:var(--red)" id="delPBtn">Delete Product</button>':''}
  `);

  function syncRecipeFromDOM(){
    $$('#recipeLines .recipe-line').forEach((line,idx)=>{
      recipe[idx].ingredientId = line.querySelector('[data-f=ingredientId]').value;
      recipe[idx].qty = line.querySelector('[data-f=qty]').value;
    });
  }
  function updateCostPreview(){
    const cost = recipe.reduce((sum,r)=>{
      const ing = ingredients.find(i=>i.id===r.ingredientId);
      const qty = parseFloat(r.qty)||0;
      if(!ing) return sum;
      return sum + (ing.rate||0)*qty;
    }, 0);
    const price = parseFloat($('#fPPrice').value)||0;
    const yieldN = parseFloat($('#fPYield').value)||1;
    const ovUnit = overheadPerBatch()/yieldN + overheadPerUnit();
    const perUnit = cost/yieldN + ovUnit;
    const margin = price - perUnit;
    const marginPct = price>0 ? Math.round((margin/price)*100) : 0;
    const marginColor = margin<0 ? 'var(--red-deep)' : 'var(--good)';
    $('#costPreview').innerHTML = `
      <div class="card-row"><span class="item-meta">Ingredient cost for one batch</span><span class="item-meta" style="font-weight:600;">${money(cost)}</span></div>

    const name = $('#fPName').value.trim();

function openProduceForm(product){
  const yieldN = prodYield(product);
  openSheet(`
    <h3>Produce Batch — ${esc(product.name)}</h3>
    <label>Batches to make${yieldN!==1?` (1 batch = ${yieldN} units)`:''}</label>
    <input id="fBatchQty" type="number" min="0" step="any" inputmode="decimal" value="1">
    <div id="produceUnits" class="section-sub" style="margin-top:8px;font-weight:600;"></div>
    <div id="produceCheck" class="section-sub" style="margin-top:10px;"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost btn-block" id="cancelProdBtn">Cancel</button>
      <button class="btn btn-primary btn-block" id="confirmProdBtn">Produce</button>
    </div>
  `);
  function updateCheck(){
    const batches = parseFloat($('#fBatchQty').value)||0;
    const units = Math.round(batches*yieldN*1000)/1000;
    $('#produceUnits').textContent = `That makes ${units} unit${units===1?'':'s'}.`;
    const lines = (product.recipe||[]).map(r=>{
      const ing = ingredients.find(i=>i.id===r.ingredientId);
      if(!ing) return '';
      const needed = Math.round(r.qty*batches*1000)/1000;
      const ok = ing.stock >= needed;
      return `<div style="display:flex;justify-content:space-between;padding:3px 0;color:${ok?'var(--good)':'var(--red-deep)'}">
        <span>${esc(ing.name)}</span><span>need ${needed}${ing.unit} · have ${ing.stock}${ing.unit}</span>
      </div>`;
    }).join('');
    $('#produceCheck').innerHTML = lines || 'No recipe set for this product — stock will just be added.';
  }
  $('#fBatchQty').addEventListener('input', updateCheck);
  updateCheck();
  $('#cancelProdBtn').addEventListener('click', closeSheet);
  $('#confirmProdBtn').addEventListener('click', async ()=>{
    const batches = parseFloat($('#fBatchQty').value)||0;
    if(batches<=0){ toast('Enter how many batches'); return; }
    for(const r of (product.recipe||[])){
      const ing = ingredients.find(i=>i.id===r.ingredientId);
      if(!ing || ing.stock < r.qty*batches - 1e-9){
        toast(`Not enough ${ing?ing.name:'ingredient'} in stock`);
        return;
      }
    }
    (product.recipe||[]).forEach(r=>{
      const ing = ingredients.find(i=>i.id===r.ingredientId);
      ing.stock = Math.round((ing.stock - r.qty*batches)*1000)/1000;
    });
    const units = Math.round(batches*yieldN*1000)/1000;
    product.stock = Math.round((product.stock + units)*1000)/1000;
    await Promise.all([saveIngredients(), saveProducts()]);
    closeSheet(); render();
    toast(`Produced ${units} × ${product.name}`);
  });
}

function saleCost(s){
  return s.items.reduce((a,it)=>a + (it.cost!=null ? it.cost : computeProductCost(products.find(p=>p.id===it.productId)||{recipe:[]}))*it.qty, 0);
}

// ---------- PDF Report ----------
async function sendReport(dateStr){
  const btn = $('#sendReportBtn');
  const originalText = btn.textContent;
  btn.textContent = 'Preparing report…';
  btn.disabled = true;
  try{
    if(typeof window.jspdf === 'undefined'){
      toast('PDF library still loading — try again in a moment');
      return;
    }
    const dayStart = new Date(dateStr + 'T00:00:00');
    const dayEnd = new Date(dateStr + 'T23:59:59');
    const daySales = sales.filter(s => s.ts >= dayStart.getTime() && s.ts <= dayEnd.getTime());

    const revenue = daySales.reduce((a,s)=>a+s.total,0);
    const cost = daySales.reduce((a,s)=>a+saleCost(s),0);
    const profit = revenue - cost;

    // aggregate items sold across the day
    const itemMap = {};
    daySales.forEach(s=>{
      s.items.forEach(it=>{
        if(!itemMap[it.name]) itemMap[it.name] = {qty:0, revenue:0};
        itemMap[it.name].qty += it.qty;
        itemMap[it.name].revenue += it.qty*it.price;
      });
    });

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const pageW = doc.internal.pageSize.getWidth();
    const margin = 48;
    let y = 60;

    const red = [122,35,35];
    const ink = [42,23,20];
    const muted = [130,90,80];

    doc.setFont('times','italic'); doc.setFontSize(22); doc.setTextColor(...red);
    doc.text('Aurum & Frost', margin, y);
    y += 20;
    doc.setFont('courier','normal'); doc.setFontSize(9); doc.setTextColor(...muted);
    doc.text('DAILY SALES REPORT', margin, y);
    doc.text(new Date(dateStr).toLocaleDateString('en-IN',{weekday:'long', day:'2-digit', month:'long', year:'numeric'}), pageW-margin, y, {align:'right'});
    y += 24;
    doc.setDrawColor(200,170,130);
    doc.line(margin, y, pageW-margin, y);
    y += 30;

    // stat boxes
    const stats = [
      ['Revenue', moneyPdf(revenue)],
      ['Cost', moneyPdf(cost)],
      ['Profit', moneyPdf(profit)],
      ['Bills', String(daySales.length)],
    ];
    const boxW = (pageW - margin*2 - 30) / 4;
    stats.forEach((s,i)=>{
      const x = margin + i*(boxW+10);
      doc.setDrawColor(230,210,180);
      doc.setFillColor(251,244,231);
      doc.roundedRect(x, y, boxW, 54, 4, 4, 'FD');
      doc.setFont('times','bold'); doc.setFontSize(14); doc.setTextColor(...red);
      doc.text(s[1], x+10, y+24);
      doc.setFont('courier','normal'); doc.setFontSize(7.5); doc.setTextColor(...muted);
      doc.text(s[0].toUpperCase(), x+10, y+40);
    });
    y += 84;

    doc.setFont('times','bold'); doc.setFontSize(13); doc.setTextColor(...ink);
    doc.text('Items Sold', margin, y);
    y += 18;

    const names = Object.keys(itemMap);
    if(names.length===0){
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...muted);
      doc.text('No sales recorded for this date.', margin, y);
      y += 20;
    } else {
      doc.setFont('courier','normal'); doc.setFontSize(8); doc.setTextColor(...muted);
      doc.text('ITEM', margin, y);
      doc.text('QTY', pageW-margin-160, y, {align:'right'});
      doc.text('REVENUE', pageW-margin, y, {align:'right'});
      y += 8;
      doc.setDrawColor(230,210,180);
      doc.line(margin, y, pageW-margin, y);
      y += 16;
      names.forEach(name=>{
        const row = itemMap[name];
        doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...ink);
        doc.text(name, margin, y);
        doc.text(String(row.qty), pageW-margin-160, y, {align:'right'});
        doc.text(moneyPdf(row.revenue), pageW-margin, y, {align:'right'});
        y += 20;
      });
      y += 6;
      doc.setDrawColor(...red);
      doc.line(margin, y, pageW-margin, y);
      y += 20;
      doc.setFont('times','bold'); doc.setFontSize(12); doc.setTextColor(...red);
      doc.text('Total Revenue', margin, y);
      doc.text(moneyPdf(revenue), pageW-margin, y, {align:'right'});
      y += 40;
    }

    doc.setFont('courier','normal'); doc.setFontSize(8); doc.setTextColor(...muted);
    doc.text('Aurum & Frost — Artisanal Ice Creams · Generated ' + new Date().toLocaleString('en-IN'), margin, 800);

    const fileName = `Aurum-Frost-Report-${dateStr}.pdf`;
    const blob = doc.output('blob');
    const file = new File([blob], fileName, {type:'application/pdf'});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({
          files:[file],
          title:`Aurum & Frost Report — ${dateStr}`,
          text:`Sales report for ${dateStr}`
        });
        toast('Report ready to send');
      }catch(e){
        if(e.name !== 'AbortError') downloadPdfFallback(blob, fileName);
      }
    } else {
      downloadPdfFallback(blob, fileName);
    }
  }catch(e){
    console.error(e);
    toast('Could not generate report');
  }finally{
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

function downloadPdfFallback(blob, fileName){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('PDF downloaded — attach it to WhatsApp manually');
}

// ---------- Backup & Restore ----------
async function backupData(){
  const btn = $('#backupBtn');
  const original = btn.textContent;
  btn.textContent = 'Preparing backup…';
  btn.disabled = true;
  try{
    const payload = {
      app: 'aurum-frost-billing',
      exportedAt: new Date().toISOString(),
      ingredients, products, sales, quotes: savedQuotes, overheads
    };
    const dateStr = new Date().toISOString().slice(0,10);
    const fileName = `Aurum-Frost-Backup-${dateStr}.json`;
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const file = new File([blob], fileName, {type:'application/json'});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:'Aurum & Frost Backup', text:`Data backup — ${dateStr}`});

      }catch(e){
        if(e.name !== 'AbortError') downloadJsonFallback(blob, fileName);
      }
    } else {
      downloadJsonFallback(blob, fileName);

    console.error(e);
    toast('Could not create backup');
  }finally{
    btn.textContent = original;
    btn.disabled = false;
  }

function downloadJsonFallback(blob, fileName){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Backup downloaded — save it somewhere safe');
}

function restoreData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    let data;
    try{
      data = JSON.parse(ev.target.result);
    }catch(err){
      toast('That file doesn\'t look like a valid backup');
      e.target.value = '';
      return;
    }
    if(!data || !Array.isArray(data.ingredients) || !Array.isArray(data.products) || !Array.isArray(data.sales)){
      toast('That file doesn\'t look like a valid backup');
      e.target.value = '';
      return;
    }
    const dateNote = data.exportedAt ? new Date(data.exportedAt).toLocaleString('en-IN') : 'unknown date';
    const confirmMsg = `Restore backup from ${dateNote}?\n\nThis will REPLACE everything currently on this phone:\n- ${data.ingredients.length} ingredients\n- ${data.products.length} products\n- ${data.sales.length} sales records${Array.isArray(data.quotes)?`\n- ${data.quotes.length} saved quotes`:''}\n\nThis can't be undone.`;
    if(!confirm(confirmMsg)){
      e.target.value = '';
      return;
    }
    ingredients = data.ingredients;
    products = data.products;
    sales = data.sales;
    if(Array.isArray(data.quotes)) savedQuotes = data.quotes;
    if(Array.isArray(data.overheads)) overheads = data.overheads;
    await Promise.all([saveIngredients(), saveProducts(), saveSales(), saveQuotes(), saveOverheads()]);
    e.target.value = '';
    render();
    toast('Backup restored');
  };
  reader.readAsText(file);
}

// ================= SHARED HELPERS (costing) =================
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const blankIf0 = x => (x===0 || x==null) ? '' : x;
const round2 = n => Math.round(n*100)/100;
const rate2 = n => '₹' + num(n).toLocaleString('en-IN',{minimumFractionDigits:2, maximumFractionDigits:2});
const rate2Pdf = n => 'Rs. ' + num(n).toLocaleString('en-IN',{minimumFractionDigits:2, maximumFractionDigits:2});
const rupee0 = n => (n<0?'-':'') + '₹' + Math.round(Math.abs(n)).toLocaleString('en-IN');
// Rates per tiny unit (e.g. ₹0.3 per ml) need more decimals than 2.
const rateTxt = n => { n = num(n); const d = n>=10 ? 2 : 4; const f = Math.pow(10,d); return '₹' + (Math.round(n*f)/f).toLocaleString('en-IN',{maximumFractionDigits:d}); };

// A recipe is written per BATCH. batchYield says how many units (tubs) a batch makes.
// Older products have no batchYield, which counts as 1 (recipe per single unit, as before).
function prodYield(p){ return (p && num(p.batchYield) > 0) ? num(p.batchYield) : 1; }
function productBatchCost(p){
  return (p.recipe||[]).reduce((s,r)=>{
    const g = ingredients.find(i=>i.id===r.ingredientId);
    return g ? s + (g.rate||0)*num(r.qty) : s;
  }, 0);
}

// ================= PRODUCTION COSTS (labour, electricity, gas, packaging) =================
// Set once, added to the cost of every flavour. Each line is "₹ cost covers N batches (or tubs)",
// e.g. gas cylinder ₹1,900 covers 60 batches = ₹31.67 per batch.
let overheads = [];
const saveOverheads = () => save('af-overheads', overheads);
const ovAmount = o => (num(o.covers)>0 ? num(o.cost)/num(o.covers) : 0);
function overheadPerBatch(){ return overheads.filter(o=>o.per==='batch').reduce((s,o)=>s+ovAmount(o), 0); }
function overheadPerUnit(){ return overheads.filter(o=>o.per==='unit').reduce((s,o)=>s+ovAmount(o), 0); }
function productOverheadPerUnit(p){ return overheadPerBatch()/prodYield(p) + overheadPerUnit(); }

const OV_PRESETS = [
  {label:'Labour', per:'batch'},
  {label:'Electricity', per:'batch'},
  {label:'Gas', per:'batch'},
  {label:'Tub, lid and label', per:'unit'},

  function refreshOv(){
    let pb = 0, pu = 0;
    lines.forEach((o,i)=>{
      const a = ovAmount(o);
      if(o.per==='unit') pu += a; else pb += a;
      const el = document.querySelector(`#ovLines [data-calc="${i}"]`);
      if(el) el.textContent = a>0 ? `= ${rateTxt(a)} per ${o.per==='unit'?'tub':'batch'}` : '';

      <div class="q-row" style="border:none;padding:6px 0 0;"><span>Adds to every tub</span><span>${rateTxt(pu)}</span></div>`;
  }

    document.querySelectorAll('#ovLines .qline').forEach(row=>{
      const o = lines[+row.dataset.i];
      row.querySelectorAll('[data-f]').forEach(el=>{ o[el.dataset.f] = el.value; });
    });
  }
  refreshOv();
  const root = $('#ovRoot');
  root.addEventListener('input', e=>{ if(e.target.tagName==='SELECT') return; sync(); refreshOv(); });
  root.addEventListener('change', e=>{ if(e.target.tagName==='SELECT'){ sync(); refreshOv(); } });
  root.addEventListener('click', e=>{
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    sync();
    if(btn.dataset.act==='rm'){
      lines.splice(+btn.closest('.qline').dataset.i, 1);
      $('#ovLines').innerHTML = rowsHtml(); refreshOv();
    } else if(btn.dataset.act==='add'){
      const p = OV_PRESETS[+btn.dataset.p] || {label:'', per:'batch'};
      lines.push({id:uid(), label:p.label, cost:'', covers:1, per:p.per});
      $('#ovLines').innerHTML = rowsHtml(); refreshOv();
    }
  });
  $('#ovCancel').addEventListener('click', closeSheet);
  $('#ovSave').addEventListener('click', async ()=>{
    sync();
    overheads = lines
      .filter(o=>String(o.label).trim() && num(o.cost)>0 && num(o.covers)>0)
      .map(o=>({id:o.id||uid(), label:String(o.label).trim(), cost:num(o.cost), covers:num(o.covers), per:o.per==='unit'?'unit':'batch'}));
    await saveOverheads();
    closeSheet(); render();
    toast('Production costs saved');
  });
}

let savedQuotes = [];
let quote = null; // the quote being worked on (kept as a draft automatically)

// Labour, gas, electricity and packaging live in Production costs (Recipes tab).
// These extras are for costs that belong to this one order.
const EXTRA_PRESETS = [
  {label:'Delivery', type:'order'},
  {label:'Ice box / cold chain', type:'order'},
];
const MARGIN_LADDER = [20,30,40,50,60];

function blankQuote(){
  return {id:null, name:'', customer:'', items:[], extras:[],
          wastage:5, margin:40, gst:0, validity:7, steps:[0.5,1,2,4], notes:''};
}
function normQuote(d){
  const q = Object.assign(blankQuote(), d||{});
  if(!Array.isArray(q.items)) q.items = [];
  if(!Array.isArray(q.extras)) q.extras = [];
  if(!Array.isArray(q.steps) || q.steps.length!==4) q.steps = [0.5,1,2,4];
  return q;
}

// Round a rate up to the next 50 paise.
function autoRate(x){ return Math.ceil(x*2 - 1e-9)/2; }
function rateOf(r){ return (r.it.offer!=null && r.it.offer!=='') ? num(r.it.offer) : r.auto; }

// Works out the whole order. `mult` scales every flavour's units (used to compare sizes).
// Per-order costs (delivery etc.) are shared equally across all units, which is why a
// bigger order brings the cost per unit down.
function calcOrder(q, mult){
  mult = (mult==null) ? 1 : mult;
  const w = num(q.wastage)/100;
  const perUnitExtra = q.extras.filter(e=>e.type==='unit').reduce((s,e)=>s+num(e.amount), 0);
  const perOrderExtra = q.extras.filter(e=>e.type==='order').reduce((s,e)=>s+num(e.amount), 0);
  const m = Math.min(Math.max(num(q.margin),0),95)/100;
  const rows = q.items.map(it=>{
    const p = products.find(x=>x.id===it.productId);
    const qty = num(it.qty)*mult;
    const batchCost = p ? productBatchCost(p) : 0;
    const yieldN = prodYield(p);
    const ingPerUnit = batchCost/yieldN;
    const ovPerUnit = p ? productOverheadPerUnit(p) : 0;   // labour, gas, electricity, packaging
    return {it, p, qty, batchCost, yieldN, ingPerUnit, ovPerUnit, waste: ingPerUnit*w};
  });
  const totalUnits = rows.reduce((s,r)=>s+r.qty, 0);
  const share = totalUnits>0 ? perOrderExtra/totalUnits : 0;
  rows.forEach(r=>{
    r.variable = r.ingPerUnit + r.waste + r.ovPerUnit + perUnitExtra;
    r.cost = r.variable + share;
    r.suggested = r.cost/(1-m);
    r.auto = autoRate(r.suggested);
  });
  const totalCost = rows.reduce((s,r)=>s + r.variable*r.qty, 0) + (totalUnits>0 ? perOrderExtra : 0);
  return {rows, totalUnits, perUnitExtra, perOrderExtra, share, totalCost, m, w};
}
function evalOrder(q, c){
  const rev = c.rows.reduce((s,r)=>s + r.qty*rateOf(r), 0);
  const profit = rev - c.totalCost;
  const marginPct = rev>0 ? profit/rev*100 : 0;
  const gstAmt = rev*num(q.gst)/100;
  return {rev, profit, marginPct, gstAmt, grand: rev+gstAmt};
}

function refreshQuote(){
  const q = quote;
  const c = calcOrder(q, 1);
  const ev = evalOrder(q, c);
  const gst = num(q.gst);
  const unitsTxt = round2(c.totalUnits);

  // per-flavour info lines
  c.rows.forEach((r,i)=>{
    const info = document.querySelector(`#qItems [data-info="${i}"]`);
    const sum = document.querySelector(`#qItems [data-isum="${i}"]`);
    const offerInput = document.querySelector(`#qItems .qline[data-i="${i}"] [data-f=offer]`);
    if(offerInput) offerInput.placeholder = 'auto ' + rate2(r.auto);
    if(info) info.innerHTML = r.p
      ? `Cost ${rate2(r.cost)}<br>Suggested ${rate2(r.suggested)}`
      : 'Choose a flavour';
    if(sum){
      const rate = rateOf(r);
      const amt = r.qty*rate;
      const prof = amt - r.cost*r.qty;
      sum.innerHTML = r.p && r.qty>0
        ? `<span>${round2(r.qty)} × ${rate2(rate)} = <b>${rupee0(amt)}</b></span><span class="${prof>=0?'q-pos':'q-neg'}">profit ${rupee0(prof)}</span>`
        : '';
    }
  });

  // warnings
  const warns = [];
  if(q.items.length===0) warns.push('Add a flavour to get a cost.');
  else {
    if(q.items.some(it=>!it.productId)) warns.push('Choose a flavour for every line.');
    if(q.items.some(it=>num(it.qty)<=0)) warns.push('Enter the units ordered for each flavour.');
    const noCost = c.rows.filter(r=>r.p && r.batchCost<=0).map(r=>r.p.name);
    if(noCost.length) warns.push(`${noCost.map(esc).join(', ')} ${noCost.length>1?'have':'has'} no ingredient cost. Add the recipe in Recipes and the cost of each ingredient in Stock, or the rate will be too low.`);
  }

  // summary
  const ingTotal = c.rows.reduce((s,r)=>s + r.ingPerUnit*r.qty, 0);
  const wasteTotal = c.rows.reduce((s,r)=>s + r.waste*r.qty, 0);
  const ovTotal = c.rows.reduce((s,r)=>s + r.ovPerUnit*r.qty, 0);
  const rateRows = c.rows.filter(r=>r.p).map(r=>`<tr><td style="font-family:'Space Grotesk',sans-serif;">${esc(r.p.name)}</td><td>${round2(r.qty)}</td><td>${rate2(r.cost)}</td><td>${rate2(rateOf(r))}</td><td>${rupee0(r.qty*rateOf(r))}</td></tr>`).join('');
  let pill = '';
  if(c.totalUnits>0){
    if(ev.profit < 0) pill = `<span class="stock-pill stock-out">Below cost: you lose ${rupee0(-ev.profit)}</span>`;
    else if(ev.marginPct < c.m*100 - 0.05) pill = `<span class="stock-pill stock-low">Below your ${round2(c.m*100)}% target</span>`;
    else pill = '<span class="stock-pill stock-ok">Meets your target</span>';
  }
  $('#qSummary').innerHTML = `
    ${warns.length ? `<div class="q-warn">${warns.join('<br>')}</div>` : ''}
    <div class="card q-top">
      <div class="q-lbl">Order value · ${unitsTxt} units${gst>0?' · before GST':''}</div>
      <div class="q-big">${rupee0(ev.rev)}</div>
      <div class="q-sub">Your profit ${rupee0(ev.profit)} (${round2(ev.marginPct)}% margin)<br>Total cost ${rupee0(c.totalCost)}</div>
    </div>
    <div class="card">
      <div class="q-sec">Rate for each flavour</div>
      ${rateRows ? `<table class="qt"><thead><tr><th>Flavour</th><th>Units</th><th>Cost</th><th>Rate</th><th>Amount</th></tr></thead><tbody>${rateRows}</tbody></table>` : '<p class="q-hint" style="margin-top:0;">Nothing to show yet.</p>'}
      ${pill ? `<div style="margin-top:10px;">${pill}</div>` : ''}
      ${gst>0 ? `<div class="q-row" style="margin-top:10px;"><span>GST ${round2(gst)}%</span><span>${rupee0(ev.gstAmt)}</span></div>
      <div class="q-row b"><span>Customer pays</span><span>${rupee0(ev.grand)}</span></div>` : ''}
      <p class="q-hint">Cost per unit includes ingredients, wastage, per-unit costs and a share of the per-order costs.</p>
    </div>
    <div class="card">
      <div class="q-sec">Where the cost comes from</div>
      <div class="q-row"><span>Ingredients</span><span>${rupee0(ingTotal)}</span></div>
      <div class="q-row"><span>Wastage (${round2(num(q.wastage))}%)</span><span>${rupee0(wasteTotal)}</span></div>
      <div class="q-row"><span>Production costs (labour, gas…)</span><span>${rupee0(ovTotal)}</span></div>
      <div class="q-row"><span>Per-unit extras × ${unitsTxt}</span><span>${rupee0(c.perUnitExtra*c.totalUnits)}</span></div>
      <div class="q-row"><span>Per-order extras</span><span>${rupee0(c.totalUnits>0?c.perOrderExtra:0)}</span></div>
      <div class="q-row b"><span>Total cost</span><span>${rupee0(c.totalCost)}</span></div>
    </div>`;

  // order size comparison
  $$('#quoteRoot tr[data-sr]').forEach(tr=>{
    const k = num(q.steps[+tr.dataset.sr]);
    const sc = calcOrder(q, k);
    const set = (key, txt)=>{ const td = tr.querySelector(`[data-c=${key}]`); if(td) td.textContent = txt; };
    tr.classList.toggle('hl', Math.abs(k-1) < 1e-9);
    if(sc.totalUnits>0){
      const val = sc.rows.reduce((s,r)=>s + r.qty*r.auto, 0);
      set('units', String(round2(sc.totalUnits)));
      set('cpu', rate2(sc.totalCost/sc.totalUnits));
      set('val', rupee0(val));
      set('profit', rupee0(val - sc.totalCost));
    } else ['units','cpu','val','profit'].forEach(key=>set(key,'-'));
  });

  // margin ladder (one column per flavour)
  const live = c.rows.filter(r=>r.p && r.qty>0);
  $('#qLadder').innerHTML = live.length ? `
    <div style="overflow-x:auto;"><table class="qt"><thead><tr><th>Margin</th>${live.map(r=>`<th>${esc(r.p.name.length>9 ? r.p.name.slice(0,8)+'…' : r.p.name)}</th>`).join('')}<th>Profit</th></tr></thead><tbody>
    ${MARGIN_LADDER.map(m=>{
      const rates = live.map(r=>autoRate(r.cost/(1-m/100)));
      const val = live.reduce((s,r,i)=>s + r.qty*rates[i], 0);
      const hl = Math.abs(m - c.m*100) < 0.5;
      return `<tr class="${hl?'hl':''}"><td>${m}%</td>${rates.map(x=>`<td>${rate2(x)}</td>`).join('')}<td>${rupee0(val - c.totalCost)}</td></tr>`;
    }).join('')}
    </tbody></table></div>
    <p class="q-hint">Rate per unit for each flavour, rounded up to the next 50 paise, and the profit on the whole order.</p>` :
    '<p class="q-hint" style="margin-top:0;">Add a flavour and its units to see this.</p>';

  // stock check, all flavours together
  const need = {};
  const batchLines = [];
  c.rows.forEach(r=>{
    if(!r.p || r.qty<=0) return;
    const batches = r.qty / r.yieldN;
    batchLines.push(`<div class="q-row"><span>${esc(r.p.name)}</span><span>${round2(r.qty)} units = ${round2(batches)} batches (${Math.ceil(batches-1e-9)} in practice)</span></div>`);
    (r.p.recipe||[]).forEach(rc=>{
      const g = ingredients.find(i=>i.id===rc.ingredientId);
      if(!g) return;
      need[g.id] = need[g.id] || {g, qty:0};
      need[g.id].qty += num(rc.qty)*batches*(1+c.w);
    });
  });
  const needList = Object.values(need);
  $('#qStockCard').style.display = needList.length ? '' : 'none';
  if(needList.length){
    $('#qStock').innerHTML = batchLines.join('') + needList.map(({g,qty})=>{
      const ok = g.stock >= qty - 1e-9;
      return `<div class="q-row" style="color:${ok?'var(--good)':'var(--red-deep)'}"><span>${esc(g.name)}</span><span>need ${round2(qty)} ${esc(g.unit)} · have ${round2(g.stock)}${ok?'':` (short ${round2(qty-g.stock)})`}</span></div>`;
    }).join('') + '<p class="q-hint">Checked against the stock you have now, including wastage, across all flavours together. You cannot make part of a batch, so plan for the batches in practice.</p>';
  }

  // sticky bar
  $('#qbCnt').textContent = `Order value · ${unitsTxt} units`;
  $('#qbAmt').textContent = `${rupee0(ev.rev)} · profit ${rupee0(ev.profit)}`;

  persistDraft();
}

// ---------- Save / list ----------
async function saveCurrentQuote(asCopy){
  const q = quote;
  if(!q.name.trim() && !q.customer.trim()){ toast('Give the quote a name or customer first'); return; }
  if(q.items.length===0){ toast('Add at least one flavour first'); return; }
  if(!q.name.trim()){ q.name = q.customer.trim(); }
  // Lock in the rate being quoted for each flavour, so reopening the quote later
  // shows what you actually offered even if ingredient prices have changed since.
  const c0 = calcOrder(q, 1);
  q.items.forEach((it,i)=>{ if(it.offer==null || it.offer==='') it.offer = c0.rows[i].auto; });
  const c = calcOrder(q, 1);
  const ev = evalOrder(q, c);
  const snap = JSON.parse(JSON.stringify(q));
  snap.savedAt = Date.now();
  snap.totals = {units: c.totalUnits, value: ev.rev, profit: ev.profit};
  const existingIdx = (!asCopy && q.id) ? savedQuotes.findIndex(x=>x.id===q.id) : -1;
  if(existingIdx>=0){
    savedQuotes[existingIdx] = snap;
  } else {
    snap.id = uid();
    q.id = snap.id;
    savedQuotes.unshift(snap);
  }
  await saveQuotes();
  persistDraft();
  renderQuote($('#main'));
  toast(existingIdx>=0 ? 'Quote updated' : 'Quote saved');
}

function renderSavedQuotes(){
  const box = $('#qSaved');
  if(!box) return;
  if(savedQuotes.length===0){
    box.innerHTML = '<div class="empty"><p>No saved quotes yet. Save one to find it here later.</p></div>';
    return;
  }
  box.innerHTML = savedQuotes.map(sq=>{
    const t = sq.totals || {units:0, value:0, profit:0};
    const flavours = (sq.items||[]).map(it=>`${it.name||'?'} ×${round2(num(it.qty))}`).join(', ');
    return `<div class="card">
      <div class="item-name">${esc(sq.name||sq.customer||'Quote')}</div>
      <div class="item-meta">${sq.customer ? esc(sq.customer)+' · ' : ''}${new Date(sq.savedAt||Date.now()).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</div>
      <div class="item-meta" style="margin-top:4px;">${esc(flavours)}</div>
      <div class="item-meta" style="margin-top:4px;">${round2(t.units)} units · ${rupee0(t.value)} · profit ${rupee0(t.profit)}</div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-sm btn-primary" data-act="openQuote" data-id="${sq.id}" type="button">Open</button>
        <button class="btn btn-sm btn-outline" data-act="delQuote" data-id="${sq.id}" type="button">Delete</button>
      </div>
    </div>`;
  }).join('');
}

// ---------- Customer PDF (flavours, units, rates and total only; no costs) ----------
async function shareQuotePdf(){
  const q = quote;
  const c = calcOrder(q, 1);
  const lines = c.rows.filter(r=>r.p && r.qty>0 && rateOf(r)>0);
  if(lines.length===0){ toast('Add a flavour with units and a rate first'); return; }
  if(typeof window.jspdf==='undefined'){ toast('PDF library still loading — try again in a moment'); return; }
  const btn = $('#qShareBtn');
  const original = btn.textContent;
  btn.textContent = 'Preparing quote…';
  btn.disabled = true;
  try{
    const blob = buildQuotePdfBlob(q, c, lines);
    const safe = (q.customer||q.name||'Quote').replace(/[^a-z0-9]+/gi,'-').replace(/^-+|-+$/g,'') || 'Quote';
    const fileName = `Aurum-Frost-Quote-${safe}.pdf`;
    const file = new File([blob], fileName, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:'Aurum & Frost Quote', text:'Quote from Aurum & Frost'});
      }catch(e){
        if(e.name !== 'AbortError') downloadPdfFallback(blob, fileName);
      }
    } else {
      downloadPdfFallback(blob, fileName);
    }
  }catch(e){
    console.error(e);
    toast('Could not generate quote');
  }finally{
    btn.textContent = original;
    btn.disabled = false;
  }
}

function buildQuotePdfBlob(q, c, lines){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 48;
  const red = [122,35,35], ink = [42,23,20], muted = [130,90,80];
  const rev = lines.reduce((s,r)=>s + r.qty*rateOf(r), 0);
  const gst = num(q.gst);
  const gstAmt = rev*gst/100;
  const grand = rev + gstAmt;
  const now = new Date();
  const fmtD = d => d.toLocaleDateString('en-IN',{day:'2-digit', month:'short', year:'numeric'});
  const validDays = Math.max(0, Math.round(num(q.validity)));
  const validTill = new Date(now.getTime() + validDays*86400000);
  const pad = n => String(n).padStart(2,'0');
  const quoteNo = `AF-Q-${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;
  let y = 60;

  doc.setFont('times','italic'); doc.setFontSize(22); doc.setTextColor(...red);
  doc.text('Aurum & Frost', margin, y);
  y += 20;
  doc.setFont('courier','normal'); doc.setFontSize(9); doc.setTextColor(...muted);
  doc.text('QUOTATION', margin, y);
  doc.text(fmtD(now), pageW-margin, y, {align:'right'});
  y += 14;
  doc.text(quoteNo, pageW-margin, y, {align:'right'});
  y += 10;
  doc.setDrawColor(200,170,130);
  doc.line(margin, y, pageW-margin, y);
  y += 30;

  if(q.customer.trim()){
    doc.setFont('courier','normal'); doc.setFontSize(8); doc.setTextColor(...muted);
    doc.text('PREPARED FOR', margin, y);
    y += 16;
    doc.setFont('times','bold'); doc.setFontSize(15); doc.setTextColor(...ink);
    doc.text(q.customer.trim(), margin, y);
    y += 30;
  }

  const xQty = pageW-margin-200, xRate = pageW-margin-100, xAmt = pageW-margin;
  doc.setFont('courier','normal'); doc.setFontSize(8); doc.setTextColor(...muted);
  doc.text('FLAVOUR', margin, y);
  doc.text('QTY', xQty, y, {align:'right'});
  doc.text('RATE / UNIT', xRate, y, {align:'right'});
  doc.text('AMOUNT', xAmt, y, {align:'right'});
  y += 8;
  doc.setDrawColor(230,210,180);
  doc.line(margin, y, pageW-margin, y);
  y += 20;

  lines.forEach(r=>{
    if(y > 700){ doc.addPage(); y = 60; }
    const rate = rateOf(r);
    doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(...ink);
    const nameLines = doc.splitTextToSize(r.p.name, xQty - margin - 40);
    doc.text(nameLines, margin, y);
    doc.text(String(round2(r.qty)), xQty, y, {align:'right'});
    doc.text(rate2Pdf(rate), xRate, y, {align:'right'});
    doc.text(rate2Pdf(r.qty*rate), xAmt, y, {align:'right'});
    y += nameLines.length*14;
    if(String(r.it.unitLabel||'').trim()){
      doc.setFontSize(9); doc.setTextColor(...muted);
      doc.text(String(r.it.unitLabel).trim(), margin, y);
      y += 14;
    }
    y += 6;
    doc.setDrawColor(240,226,200);
    doc.line(margin, y, pageW-margin, y);
    y += 18;
  });

  y += 4;
  if(gst>0){
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(...ink);
    doc.text('Subtotal', xRate-40, y, {align:'right'});
    doc.text(rate2Pdf(rev), xAmt, y, {align:'right'});
    y += 18;
    doc.text(`GST (${round2(gst)}%)`, xRate-40, y, {align:'right'});
    doc.text(rate2Pdf(gstAmt), xAmt, y, {align:'right'});
    y += 10;
    doc.setDrawColor(...red);
    doc.line(xRate-120, y, pageW-margin, y);
    y += 20;
  } else {
    doc.setDrawColor(...red);
    doc.line(xRate-120, y-8, pageW-margin, y-8);
    y += 8;
  }
  doc.setFont('times','bold'); doc.setFontSize(14); doc.setTextColor(...red);
  doc.text('Total', xRate-40, y, {align:'right'});
  doc.text(rate2Pdf(grand), xAmt, y, {align:'right'});
  y += 40;

  if(q.notes.trim()){
    if(y > 700){ doc.addPage(); y = 60; }
    doc.setFont('courier','normal'); doc.setFontSize(8); doc.setTextColor(...muted);
    doc.text('NOTES', margin, y);
    y += 14;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...ink);
    const nl = doc.splitTextToSize(q.notes.trim(), pageW - margin*2);
    doc.text(nl, margin, y);
    y += nl.length*13 + 16;
  }

  if(validDays>0){
    if(y > 740){ doc.addPage(); y = 60; }
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...ink);
    doc.text(`These rates are valid until ${fmtD(validTill)}.`, margin, y);
  }

  const last = doc.getNumberOfPages();
  for(let pg=1; pg<=last; pg++){
    doc.setPage(pg);
    doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(...red);
    doc.text('Handmade in small batches · Completely vegetarian', margin, 782);
    doc.setFont('courier','normal'); doc.setFontSize(8); doc.setTextColor(...muted);
    doc.text('Aurum & Frost — Artisanal Ice Creams', margin, 800);
  }

  return doc.output('blob');
}

// ---------- Sheet helpers ----------
function openSheet(html){
  $('#sheetContent').innerHTML = html;
  $('#sheetBackdrop').classList.add('open');
}
function closeSheet(){
  $('#sheetBackdrop').classList.remove('open');
}
$('#sheetBackdrop').addEventListener('click', e=>{
  if(e.target===$('#sheetBackdrop')) closeSheet();
});

// Cost of ONE unit: the recipe is for a whole batch, so divide by what a batch makes,
// then add the production costs (labour, gas, electricity, packaging).
function computeProductCost(product){
  return productBatchCost(product) / prodYield(product) + productOverheadPerUnit(product);
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- Init ----------
(async function init(){
  await loadAll();
  render();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
